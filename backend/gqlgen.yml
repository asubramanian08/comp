schema:
  - schema.graphqls

exec:
  filename: generated/generated.go
  package: generated

model:
  filename: generated/models_gen.go
  package: generated

resolver:
  layout: follow-schema
  dir: .
  package: main
  filename_template: "{name}.resolvers.go"

models:
  Int:
    model: github.com/99designs/gqlgen/graphql.Int64
